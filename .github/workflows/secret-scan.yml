name: Secret scan (reusable)

# Micro-workflow: runs the toolkit's self-developed secret scanner
# (scripts/secret_scan.py, pure stdlib) against all tracked files in the
# CALLER repository. This is the toolkit-owned scanner — distinct from
# Gitleaks, which consumers run themselves if they want it (third-party
# wrappers are deliberately not collected in this toolkit).
#
# Dual purpose: the same script backs the toolkit's pre-commit hook
# (`secret-scan`, with --staged); the CI mode scans every tracked file.

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Toolkit ref providing the scanner implementation.
        type: string
        default: "v1.0.1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Check out quality-gates-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LuisArteaga/quality-gates-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false

      - name: Run secret scan
        # The scanner uses `git ls-files` (tracked files) — works on a
        # shallow checkout. It runs from the caller checkout; the scanner
        # itself lives in the sibling toolkit checkout.
        working-directory: repo
        run: python3 ../toolkit/scripts/secret_scan.py
