name: LLM PR review (reusable)

# Micro-workflow: runs the toolkit's PR Review Judges on a pull request's
# diff and posts the combined review carrying the hidden
# `llm-pr-review-verdicts` block. That block format is a versioned public
# contract of this toolkit (see DECISIONS.md, D-0002).
#
# The executed file is the scripts/review.py backward-compatibility shim
# (D-0017): direct execution cannot target quality_gates_toolkit/review.py
# itself (relative imports need package context), so the shim loads the
# implementation from the toolkit checkout and dispatches to its main().
#
# Design notes:
# - The toolkit checkout is PUBLIC — no PAT is needed for it; the caller's
#   GITHUB_TOKEN covers the caller checkout. (The origin design needed a PAT
#   only because the tooling lived in a private repo — that flaw is gone.)
# - judge-token is OPTIONAL and falls back to github.token. Plain consumers
#   get reviews authored by github-actions[bot]; an installation token
#   cannot approve a pull request at all (repository setting "Allow GitHub
#   Actions to create and approve pull requests"), so those reviews are
#   always posted as comment reviews carrying the identical verdict block.
#   Consumers that verify review authorship (trusted-identity automerge
#   models) or want a verdict-driven review state must pass a PAT whose
#   owner matches their trusted judge identity.
# - Judge model configuration is consumer-owned: resolve config-path from
#   the caller tree (default config/factory.json). See config/factory.example.json
#   for both routing modes.

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Toolkit ref providing the review implementation.
        type: string
        default: "v1.9.3"
      config-path:
        description: Judge config path relative to the caller repository root.
        type: string
        default: "config/factory.json"
      diff-exclude:
        description: >-
          Space-separated git pathspecs to exclude from the judge diff, e.g.
          `uv.lock package-lock.json`. Empty excludes nothing.
        type: string
        default: ""
      prefetch-tree-sitter:
        description: Best-effort parser prefetch for enclosing-function enrichment.
        type: boolean
        default: false
      batch-budget-chars:
        description: >-
          Per-batch character budget for splitting the judge diff. Raise it
          (e.g. 500000) so large bootstrap diffs are judged in a single
          batch — per-batch judges otherwise only see their own slice and
          may wrongly report "tests missing" for files whose tests landed
          in another batch.
        type: string
        default: ""
    secrets:
      openrouter-api-key:
        description: OpenRouter API key for the LLM judges.
        required: true
      judge-token:
        description: >-
          Not needed for the default contract: without it the review is
          posted by github-actions[bot] as a comment review carrying the
          identical verdict block, reasoning and KPI table (installation
          tokens cannot approve a pull request). Pass a PAT only if your
          consumer verifies review authorship (trusted-identity automerge)
          or needs the review state to follow the verdict.
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  llm-pr-review:
    runs-on: ubuntu-latest
    # The 429-aware retry budget (REVIEW_RETRY_BUDGET_SECONDS, default
    # 45 min) plus four judges over chunked diffs can push a run past one
    # hour; the timeout guards against a hung transport, not the retry
    # policy.
    timeout-minutes: 90
    env:
      AGENT_MODE: ci
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Fallback chain: declared-but-unset secrets evaluate to empty, so the
      # `||` covers both "caller passed a PAT" and "use the default token".
      GH_TOKEN: ${{ secrets.judge-token || github.token }}
      OPENROUTER_API_KEY: ${{ secrets.openrouter-api-key }}
      # Resolved relative to the caller checkout (review.py runs with
      # working-directory: repo below).
      REVIEW_CONFIG_PATH: ${{ inputs.config-path }}
      REVIEW_BATCH_BUDGET_CHARS: ${{ inputs.batch-budget-chars || '200000' }}
    steps:
      - name: Validate judge configuration
        # Fail-fast BEFORE the checkouts and before any API spend: a caller
        # missing the secret learns the fix in seconds rather than after the
        # toolkit download, and the message names the caller-side fix so no
        # consumer has to read this workflow to wire the secret. GitHub cannot
        # make a secret conditionally required on an input, so runtime
        # validation is the contract.
        #
        # The snippet below is assembled at run time (see `brace`) because this
        # file must not contain the expression sequence that interpolates the
        # key: a secrets-context expression inside script text is substituted
        # before the shell parses it, so echoing it would print the real key.
        #
        # Presence is not capability: the checks below also probe that the
        # token can reach the caller repository, and the boundary of what is
        # NOT checked is stated in the step's own output (issue #92, D-0005).
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "[ERR] openrouter-api-key secret not configured."
            echo "      Forward it from the calling job, e.g.:"
            echo "        secrets:"
            brace='{{'
            echo "          openrouter-api-key: \$$brace secrets.OPENROUTER_API_KEY }}"
            echo "      See README \"Secrets\" — deterministic-only usage reads no secrets."
            exit 1
          fi
          if [ -z "$PR_NUMBER" ]; then echo "[ERR] No pull_request event (PR_NUMBER empty)."; exit 1; fi
          if [ -z "$GH_TOKEN" ]; then echo "[ERR] No judge token available."; exit 1; fi
          # `gh auth status` only REPORTS status: it exits 0 even for an
          # invalid token, so it gates nothing (issue #92). Probe the caller
          # repository instead — that fails for the classes checkable
          # cheaply (an expired or revoked token, or one with no read access
          # to this repository, a strict prerequisite of `gh pr review`).
          # $GITHUB_REPOSITORY is a runner-provided variable, so the script
          # stays expression-free (D-0029); on a pull_request event it is the
          # PR's base repository, which is where the review is posted.
          #
          # Pull-requests WRITE capability is deliberately NOT pre-validated:
          # no cheap probe exists for it. The repository's `.permissions`
          # reflects the authenticated user's role rather than a fine-grained
          # PAT's granted scopes, and scope headers are absent for fine-grained
          # tokens, so gating on either would pass the very case this issue is
          # about. A token that passes here and still cannot review fails at
          # submission, where D-0024 persists the undelivered body.
          if ! gh api --silent "/repos/$GITHUB_REPOSITORY"; then
            echo "[ERR] judge-token cannot read $GITHUB_REPOSITORY."
            echo "      It must be able to read the repository and post pull-request reviews:"
            echo "      check that it is not expired and grants 'Pull requests: Read and write'"
            echo "      (fine-grained PAT) or the 'repo' / 'public_repo' scope (classic PAT)."
            echo "      Omit judge-token to post the review as github-actions[bot] instead."
            echo "      See README \"Secrets\"."
            exit 1
          fi
          echo "[INFO] judge-token can read $GITHUB_REPOSITORY."
          echo "       Pull-requests write capability is not pre-validated; a token without"
          echo "       it is refused at submission, where the undelivered body is uploaded"
          echo "       as the llm-pr-review-body artifact (D-0024)."

      - name: Check out caller repository (PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Check out quality-gates-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LuisArteaga/quality-gates-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false

      - name: Prefetch tree-sitter parsers (best-effort)
        # tree-sitter-language-pack downloads parser binaries at runtime. A
        # prefetch failure must NOT block the judge: enclosing-function-
        # context enrichment degrades gracefully for unsupported languages.
        if: inputs.prefetch-tree-sitter
        continue-on-error: true
        run: |
          pip install -q tree-sitter-language-pack
          python3 -c "
          import tree_sitter_language_pack as tsp
          try:
              tsp.prefetch(languages=['python', 'tsx', 'typescript'])
              print('Prefetched:', tsp.downloaded_languages())
          except Exception as e:
              print(f'[WARN] tree-sitter prefetch failed: {e}; enrichment will degrade.')
          "

      - name: Run PR review judges
        # review.py reads the PR diff from stdin and posts the combined
        # review via `gh pr review` using GH_TOKEN. It exits 1 when any judge
        # returns FAIL/NEEDS REVIEW (the review is posted before exit),
        # surfacing the verdict as a red check consistent with the hard
        # merge gate.
        working-directory: repo
        env:
          # Consumer input: reaches the shell through the environment, never
          # interpolated into the script text. Unquoted on purpose — a
          # space-separated list of paths whose words must split (#89 / D-0029).
          DIFF_EXCLUDE: ${{ inputs.diff-exclude }}
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          excludes=()
          for p in $DIFF_EXCLUDE; do
            excludes+=(":(exclude)$p")
          done
          git diff -w "origin/${base_ref}...HEAD" -- . "${excludes[@]}" | python3 ../toolkit/scripts/review.py

      - name: Upload undelivered review body
        # The judges' verdicts live only inside the review body. When the run
        # ends without posting it — a submission GitHub refuses, e.g. a
        # repository policy or a token that cannot review (issues #43 / #47)
        # — the file review.py wrote is the only retrievable record, so it is
        # uploaded exactly then. Both guards are load-bearing: `failure()`
        # keeps a green run artifact-free, and the hashFiles check keeps a
        # red run whose review WAS posted artifact-free too (the body is only
        # written when it was not delivered).
        if: ${{ failure() && hashFiles('repo/review_body.md') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-pr-review-body
          path: repo/review_body.md
          if-no-files-found: error
