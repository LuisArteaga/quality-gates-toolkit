name: Security scans (reusable)

# Micro-workflow: Semgrep static analysis + pip-audit dependency
# vulnerability check against the CALLER repository. Both tools are
# installed step-locally so callers whose dev extras lack them still get a
# working scan; the pinned install also overrides whatever scanner version
# the caller's environment happens to carry, so the version is the gate's,
# not the image's.
#
# Scanner versions are PINNED in the job's `env:` block and must equal the
# versions the pre-commit hooks install (.pre-commit-hooks.yaml) — one
# engine on both surfaces, so a green local run means the same scan as CI
# (D-0029). A contract test fails if the two sites ever drift; a bump moves
# both in one commit (release PR, D-0007).
#
# The Semgrep step runs the toolkit's own `semgrep-scan` wrapper from the
# sibling toolkit checkout (same file the `semgrep` pre-commit hook runs,
# D-0025): `semgrep scan` plus a bounded retry when the ruleset could not be
# fetched from semgrep.dev, which is a network condition rather than a
# finding. pip-audit needs no wrapper and no toolkit code.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the tools.
        type: string
        default: "3.12"
      scan-paths:
        description: Space-separated paths Semgrep scans (pip-audit always audits the caller root).
        type: string
        default: "."
      semgrep-config:
        description: >-
          Semgrep configuration passed to the scan as `--config=<value>`.
          `auto` (the default) resolves the registry ruleset at run time;
          pass the same value the local `semgrep` hook uses (e.g.
          `p/security-audit`) for CI/local parity.
        type: string
        default: "auto"
      enable-semgrep:
        description: Run the Semgrep security scan.
        type: boolean
        default: true
      enable-pip-audit:
        description: Run the pip-audit dependency vulnerability check.
        type: boolean
        default: true
      toolkit-ref:
        description: Toolkit ref providing the Semgrep wrapper implementation.
        type: string
        default: "v1.8.9"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      # Must equal the `.pre-commit-hooks.yaml` pins (D-0029) — the contract
      # test in tests/test_workflow_contracts.py fails if they drift apart.
      SEMGREP_VERSION: "1.177.0"
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Check out quality-gates-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LuisArteaga/quality-gates-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Semgrep security scan
        if: inputs.enable-semgrep
        working-directory: repo
        env:
          # Consumer-supplied values reach the shell ONLY through the
          # environment: `${{ inputs.x }}` inlined into `run:` is a template
          # injection surface (a caller may map untrusted context into an
          # input and break out of the argument). SCAN_PATHS stays unquoted
          # on purpose — it is a space-separated list whose words must split
          # (parameter expansion is not re-scanned for shell operators);
          # SEMGREP_CONFIG is a single value and is expanded quoted.
          SCAN_PATHS: ${{ inputs.scan-paths }}
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          pip install -q "semgrep==${SEMGREP_VERSION}"
          python3 ../toolkit/scripts/semgrep_scan.py $SCAN_PATHS --config="${SEMGREP_CONFIG:-auto}" --error

      - name: Run pip-audit dependency check
        if: inputs.enable-pip-audit
        working-directory: repo
        run: |
          pip install -q "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit .
