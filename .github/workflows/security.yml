name: Security scans (reusable)

# Micro-workflow: Semgrep static analysis + pip-audit dependency
# vulnerability check against the CALLER repository. Both tools are
# installed step-locally so callers whose dev extras lack them still get a
# working scan (idempotent where already present).
#
# The Semgrep step runs the toolkit's own `semgrep-scan` wrapper from the
# sibling toolkit checkout (same file the `semgrep` pre-commit hook runs,
# D-0025): `semgrep scan` plus a bounded retry when the ruleset could not be
# fetched from semgrep.dev, which is a network condition rather than a
# finding. pip-audit needs no wrapper and no toolkit code.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the tools.
        type: string
        default: "3.12"
      scan-paths:
        description: Space-separated paths Semgrep scans (pip-audit always audits the caller root).
        type: string
        default: "."
      enable-semgrep:
        description: Run the Semgrep security scan.
        type: boolean
        default: true
      enable-pip-audit:
        description: Run the pip-audit dependency vulnerability check.
        type: boolean
        default: true
      toolkit-ref:
        description: Toolkit ref providing the Semgrep wrapper implementation.
        type: string
        default: "v1.8.7"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Check out quality-gates-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LuisArteaga/quality-gates-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Semgrep security scan
        if: inputs.enable-semgrep
        working-directory: repo
        run: |
          pip install -q semgrep
          python3 ../toolkit/scripts/semgrep_scan.py ${{ inputs.scan-paths }} --config=auto --error

      - name: Run pip-audit dependency check
        if: inputs.enable-pip-audit
        working-directory: repo
        run: |
          pip install -q pip-audit
          pip-audit .
