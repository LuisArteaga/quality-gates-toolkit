[project]
name = "quality-gates-toolkit"
# Tracks the release train (annotated tags vX.Y.Z); bump together with the
# toolkit-ref pin sites in each release PR. 1.6.0 was the combined release
# (local Python tool hooks, PR #29; importable judge package, D-0017/PR #30 —
# v1.5.0 was never cut); 1.7.0 carries the per-language composites
# (D-0020, PR #36).
version = "1.7.0"
description = "Reusable GitHub Actions workflows, pre-commit hooks, and Python tooling for deterministic and LLM-assisted quality gates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Luis Arteaga" }]
dependencies = []

[project.scripts]
# Console script invoked by the public pre-commit hook (.pre-commit-hooks.yaml)
# and usable standalone: `secret-scan` scans the current repository.
secret-scan = "scripts.secret_scan:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Two shipped packages: quality_gates_toolkit/ (the importable judge
# implementation, D-0017) and scripts/ (the console-script package —
# `secret-scan` — plus backward-compatibility shims for the moved modules).
packages = ["quality_gates_toolkit", "scripts"]

[project.optional-dependencies]
# Runtime dependency of quality_gates_toolkit/enrichment.py
# (enclosing-function-context
# enrichment). review.py imports it lazily and degrades gracefully when the
# pack is absent, but the test suite exercises parsers directly.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyyaml",
    "tree-sitter-language-pack",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow, mirroring the proven selector the ported scripts were
# formatted against in the origin repository (pyflakes + critical
# pycodestyle). Broadening is a separate, deliberate toolkit decision — the
# judge prompt-string literals in review.py are long by design.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
disable_error_code = ["call-arg", "dict-item", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
